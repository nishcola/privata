[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privata-backend"
version = "0.1.0"
description = "Backend foundation for the Privata educational DP system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "opendp>=0.15.1,<0.16",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
